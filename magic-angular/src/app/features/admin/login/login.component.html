<div class="login-container">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Administration</mat-card-title>
      </mat-card-header>
  
      <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
  
     
      <div *ngIf="serverErrors.length > 0" class="server-errors">
        <p *ngFor="let error of serverErrors" class="error-message">
          {{ error }}
        </p>
      </div>
  
      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" placeholder="exemple@domaine.com" autocomplete="email">
            <mat-icon matPrefix>email</mat-icon>
            <mat-error *ngIf="emailControl?.hasError('required')">
              L'email est requis
            </mat-error>
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Mot de passe</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
            <mat-icon matPrefix>lock</mat-icon>
            <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
              <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="passwordControl?.hasError('required')">
              Le mot de passe est requis
            </mat-error>
          </mat-form-field>
  
          <div class="button-container">
            <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || loading">
              Se connecter
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
